<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | PrimeSYS</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080c14;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }
    body {
      margin: 0; padding: 0;
      font-family: "Outfit", sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
      color: var(--text-primary);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; text-align: center; overflow: hidden;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px; padding: 50px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 500px; width: 90%;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    h1 {
      font-size: 6rem; margin: 0;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    h2 { font-size: 1.8rem; margin: 10px 0 20px 0; font-weight: 500; }
    p { color: var(--text-secondary); margin-bottom: 30px; font-size: 1.1rem; line-height: 1.5; }
    .back-btn {
      display: inline-block; background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white; text-decoration: none; padding: 12px 30px;
      border-radius: 30px; font-weight: 600; font-size: 1.1rem;
      transition: all 0.3s ease; box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
    }
    .back-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -10px rgba(59, 130, 246, 0.7); }
    .icon { width: 80px; height: 80px; margin-bottom: 20px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="glass-card">
    <img src="icon.svg" alt="PrimeSYS" class="icon">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>It seems you have ventured into the unknown. The page you are looking for does not exist.</p>
    <a href="/" class="back-btn">Return to Dashboard</a>
  </div>
</body>
</html>
